name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Hisab OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        if: always()
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisab-os-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisab-os-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Hisab OS v1.0.3"
          body: |
            ### Hisab OS — Your Money. Your Life. In One Place. (v1.0.3)
            
            - **app-release.apk**: Production Release APK for Android (Fully Offline & Private).
            - **app-debug.apk**: Debug APK.
            
            **What's Included:**
            - 🔒 **100% Offline SQLite Architecture**: Zero backend, zero cloud, zero tracking, total financial privacy.
            - 💳 **Cash & Multi-Bank Management**: Instant transfers between accounts with atomic SQLite transaction rollback safety.
            - 📉 **Personal Spending**: Quick 1-tap presets (Chai, Snacks, Milk, Auto) + large purchases with warranty tracking.
            - 🤝 **Udhar Management**: Strictly separated "I Gave" (to receive) vs "I Borrowed" (to pay) with partial repayment ledger.
            - 🏍️ **Vehicles & Mileage**: Bikes, Scooters, Cars; fuel refuel logs with full-tank to full-tank exact mileage calculation.
            - 🏠 **Rent & Household Bills**: Room rent, electricity, Wi-Fi, water bills with 1-tap account debit and duplicate prevention.
            - 💼 **Office Attendance & Salary**: Base salary, in-hand calculation, attendance calendar, automatic unpaid leave deductions & overtime.
            - 📊 **EMI & Financial Reports**: Amortisation schedules, monthly cash flows, net worth calculations, and offline JSON backup & restore.
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
