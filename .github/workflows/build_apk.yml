name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flat-expense-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flat-expense-manager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Flat Expense Manager v1.0.2"
          body: |
            ### Flat Expense Manager – Local Wi-Fi Sharing Android App (v1.0.2)
            
            - **app-release.apk**: Production Release APK for Android.
            - **app-debug.apk**: Debug APK.
            
            **What's New in v1.0.2:**
            - 🔒 **Personal Expense Tracking**: Track your own private expenses (Mera Niji Kharcha) without splitting with flatmates.
            - 💳 **Kitna Aana Hai & Kitna Jana Hai**: Real-time balance breakdown directly on the dashboard.
            - 👥 **Flat Debt Matrix (Kisko Kitne Paise Dene Hai)**: Full transparency showing who owes whom how much with 1-tap settlement.
            - 💼 **Salary & Haziri Calculator**: Gross CTC, In-Hand calculation, daily attendance (Full Day / Half Day / Leaves), and Sandwich Leave Policy enforcement.
            - ⚡ **2-Second Real-Time Auto Sync**: Immediate peer-to-peer sync between flatmates' phones on the same Wi-Fi.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
