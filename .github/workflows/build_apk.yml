name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Debug APK
        run: |
          set +e
          flutter build apk --debug -v > build_debug.log 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error title=Flutter Build Failed::Debug APK Build failed with code $BUILD_STATUS"
            echo "--- RELEVANT ERRORS FROM LOG ---"
            grep -i -E "error|exception|failure|what went wrong" -C 4 build_debug.log | tail -n 80
            echo "--- LAST 60 LINES OF LOG ---"
            tail -n 60 build_debug.log
            exit $BUILD_STATUS
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flat-expense-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flat-expense-manager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
