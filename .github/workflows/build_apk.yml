name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flat-expense-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flat-expense-manager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Flat Expense Manager v1.0.0"
          body: |
            ### Flat Expense Manager – Local Wi-Fi Sharing Android App
            
            - **app-release.apk**: Release build optimized for Android devices.
            - **app-debug.apk**: Debug build with full logs.
            
            **Highlights:**
            - 100% Offline & Local SQLite storage.
            - Direct peer-to-peer Wi-Fi synchronization & QR code pairing.
            - Equal/custom/percentage expense splits & debt minimization algorithm.
            - Shared shopping list with atomic expense conversion.
            - Separate income & contribution tracking.
            - JSON backup and restore.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
