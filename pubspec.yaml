name: flat_expense_manager
description: "A local Wi-Fi peer-to-peer flat expense manager and shopping tracker."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Persistence
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Formatting & Identifiers
  uuid: ^4.4.0
  intl: ^0.19.0

  # QR Code Pairing
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Network Info for Wi-Fi discovery
  network_info_plus: ^5.0.3

  # File Backup & Image Picking
  file_picker: ^8.0.5
  share_plus: ^9.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
